<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Animate MCP Bridge</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #262626;
            color: #E0E0E0;
            padding: 16px;
            font-size: 12px;
            margin: 0;
        }
        h2 {
            font-size: 14px;
            margin-top: 0;
            color: #FFFFFF;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            background: #2E7D32;
            color: #FFF;
            font-weight: bold;
            font-size: 11px;
            margin-bottom: 12px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            padding: 4px 0;
            border-bottom: 1px solid #333;
        }
        .stat-label { color: #888; }
        .stat-val { font-weight: 600; color: #FFF; }
        #log {
            margin-top: 12px;
            background: #1A1A1A;
            border: 1px solid #333;
            border-radius: 4px;
            height: 100px;
            overflow-y: auto;
            padding: 6px;
            font-family: monospace;
            font-size: 10px;
            color: #AAA;
        }
    </style>
</head>
<body>
    <h2>Animate MCP Bridge</h2>
    <div id="statusBadge" class="badge">LISTENING</div>
    <div class="stat-row">
        <span class="stat-label">Port:</span>
        <span id="portVal" class="stat-val">8768</span>
    </div>
    <div class="stat-row">
        <span class="stat-label">Requests:</span>
        <span id="reqCount" class="stat-val">0</span>
    </div>
    <div class="stat-row">
        <span class="stat-label">Last Command:</span>
        <span id="lastCmd" class="stat-val">None</span>
    </div>
    <div id="log">Bridge active. Ready for MCP requests...</div>

    <script src="./CSInterface.js"></script>
    <script src="./index.js"></script>
</body>
</html>
