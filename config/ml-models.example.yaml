models:
  dwpose:
    enabled: true
    runtime: "local"
    repo: "IDEA-Research/DWPose"
    weights_path: "dwpose/dw-ll_ucoco_384.onnx"
    device: "cpu" # cpu, mps, cuda
  sam2_1:
    enabled: false
    runtime: "local"
    repo: "facebookresearch/sam2"
    weights_path: "sam2/sam2.1_hiera_large.pt"
    device: "mps"
  grounded_sam2:
    enabled: false
    runtime: "local"
    repo: "IDEA-Research/Grounded-SAM-2"
    weights_path: "grounded_sam2/"
    device: "cuda"
  animeinbet:
    enabled: false
    runtime: "local"
    repo: "lisiyao21/AnimeInbet"
    weights_path: "animeinbet/animeinbet_v1.pth"
    device: "cuda"
  kbrodt_inbetweening:
    enabled: false
    runtime: "local"
    repo: "kbrodt/inbetweening"
    weights_path: "kbrodt/inbetweening_mesh_deform.pth"
    device: "cpu"
  jostc:
    enabled: false
    runtime: "local"
    repo: "jostc-cartoon/JoSTC"
    weights_path: "jostc/jostc_checkpoint.pth"
    device: "cuda"
  whisper:
    enabled: false
    runtime: "local"
    repo: "openai/whisper"
    model_size: "medium"
    device: "cpu"
  mfa:
    enabled: false
    runtime: "local"
    repo: "MontrealCorpusTools/Montreal-Forced-Aligner"
