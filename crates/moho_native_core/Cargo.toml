[package]
name = "moho_native_core"
version = "0.1.0"
edition = "2021"
authors = ["Toon Boom Harmony & Moho MCP Team"]
description = "High-performance native Rust core for vectorization, triangulation, ZIP compilation, and trajectory kinematics"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16.14", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2.16.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
crc32fast = "1.4"

[build-dependencies]
napi-build = "2.1.4"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
