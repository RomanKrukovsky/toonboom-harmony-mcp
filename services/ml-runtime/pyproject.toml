[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony-ml-runtime"
version = "0.1.0"
description = "Local verified ML runtime for toonboom-harmony-mcp"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "numpy==1.26.4",
  "onnxruntime==1.22.1",
  "opencv-python-headless==4.11.0.86",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "uvicorn==0.35.0"
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
